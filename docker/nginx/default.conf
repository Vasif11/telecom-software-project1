# Nginx application server for Scenario A.
# The log line records client IP, status, bytes and server-side request time, so the
# access log is itself evidence of who connected and how long the server took.
log_format scenario '$remote_addr:$remote_port -> $server_addr:$server_port '
                    '"$request" $status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log scenario;
    root /usr/share/nginx/html;

    location / {
        index index.html;
    }

    # Tiny endpoint for response-time tests (no disk I/O).
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
